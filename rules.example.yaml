      - name: spring-cloud-dataflow-package-upload
        match: { path: '(?i)^/api/package/upload$', regex: '(?i)packagefileasbytes', in: [body] }
      - name: crushftp-function-endpoint
        match: { regex: '(?i)^/WebInterface/function/?$', in: [path] }
      - name: servicenow-jelly-page-title
        match: { regex: '(?i)jvar_page_title', in: [query] }
      - name: coldfusion-dotdot-cfide
        match: { regex: '(?i)\.\.CFIDE/', in: [path] }
      - name: ivanti-vtm-user-creation
        match: { path: '(?i)^/apps/zxtm/wizard\.fcgi$', regex: '(?i)create_user', in: [body] }
      - name: ivanti-csa-encoded-index
        match: { regex: '(?i)^/client/index\.php(%3f|\?)\.php', in: [path] }
      - name: tomcat-case-confusion-jsp-put
        match: { method: PUT, regex: '(?i)\.jspx?$', in: [path] }
      - name: tomcat-case-confusion-artifacts
        match: { regex: '(?i)^/(aa|bb)\.jsp$', in: [path] }
      - name: encoded-question-mark-in-path
        match: { regex: '(?i)%3f', in: [path] }
      - name: spring-uri-userinfo-fragment-bypass
        match: { regex: '(?i)(%5c|%23)@', in: [query] }
      - name: nextjs-image-optimizer-ssrf
        match: { path: '(?i)^/_next/image$', regex: '(?i)url=https?://', in: [query] }
      - name: gitlab-saml-callback
        match: { path: '(?i)^/users/auth/saml/callback$', regex: '(?i)samlresponse=', in: [body] }
      - name: magento-cosmicsting-xxe
        match: { regex: '(?i)(totalscollector|dataisurl)', in: [body] }
  # Framework routing bypasses: internal route parameters, prefetch variants,
  # RPC deserialization, and request-controlled trust flags (CVE-2026-44574,
  # CVE-2026-44575, CVE-2026-27971, CVE-2026-67282).
  - name: framework-routing-bypass
    action: BLOCK
    rules:
      - name: nextjs-internal-route-parameters
        match: { regex: '(?i)(^|[?&])(nxtp|nxti)[a-z0-9_]*=', in: [query] }
      - name: nextjs-rsc-route-variants
        match: { regex: '(?i)\.rsc($|/)', in: [path] }
      - name: nextjs-rsc-transport-header
        match: { method: GET, headers: { RSC: '^1$' } }
      - name: qwik-rpc-deserialization
        match: { headers: { Content-Type: '(?i)application/qwik-json' } }
      - name: joomla-fabrik-eval-flag
        match: { regex: '(?i)\[eval\]\s*=', in: [query, body] }

  # Exposed CI/CD endpoints are consistent RCE and data-theft targets
  # (CVE-2026-63077, CVE-2026-85706, CVE-2026-70428, CVE-2026-84671).
  - name: ci-cd-servers
    action: BLOCK
    rules:
      - name: teamcity-agent-protocol
        match: { regex: '(?i)^/app/agents/v1/', in: [path] }
      - name: teamcity-xstream-payload
        match: { regex: '(?i)(linked-hash-map|schemapmismatchexception|connectioninitsqls)', in: [body] }
      - name: jspws-webshell
        match: { regex: '(?i)\.jspws($|/)', in: [path] }
      - name: gitlab-workhorse-route-bypass
        match: { regex: '(?i)/api/v4/projects/[^/]+/repository/%[0-9a-f]{2}', in: [path] }
      - name: gitlab-repository-file-read
        match:
          path: '(?i)/api/v4/projects/[^/]+/repository/'
          regex: '(?i)file\.path='
          in: [query, body]
      - name: jenkins-file-parameter-path
        match: { regex: '(?i)(init\.groovy\.d|\.jpi\b|\.groovy\b)', in: [body] }

  # OS command injection signatures.
  - name: command-injection
    action: BLOCK
    rules:
      - name: shell-metacharacters
        match: { regex: '(?i)(;|\||&&|\|\|)\s*(cat|ls|id|whoami|uname|hostname|curl|wget|nc|netcat|bash|sh|zsh|python|perl|ruby|php|rm|mv|cp|chmod|chown|kill|ps|netstat|ifconfig|iptables)\b', in: [query, body] }
      - name: command-substitution
        match: { regex: '(?i)(\$\(|`)\s*(cat|ls|id|whoami|uname|curl|wget|bash|sh|nc)\b', in: [query, body] }
      - name: shell-and-binaries
        match: { regex: '(?i)(/bin/(sh|bash|zsh|dash)|/usr/bin/(perl|python|php)|cmd\.exe|powershell(\.exe)?)', in: [query, body, path] }

  # SQL injection signatures in query, body, and cookies.
  - name: sql-injection
    action: BLOCK
    response: { status: 403, body: Forbidden }
    rules:
      - name: union-select
        match: { regex: '(?i)\bunion\b[^;]{0,20}\bselect\b', in: [query, body, cookies] }
      - name: boolean-taunts
        match: { regex: '(?i)\b(or|and)\b[\s+]+[\x27"\(\)]?\d+[\x27"\(\)]?[\s+]*=[\s+]*[\x27"\(\)]?\d+[\x27"\(\)]?', in: [query, body, cookies] }
      - name: stacked-queries
        match: { regex: '(?i);\s*(select|insert|update|delete|drop|alter|create|truncate)\b', in: [query, body, cookies] }
      - name: time-based
        match: { regex: '(?i)(\b(sleep|benchmark|pg_sleep)\s*\(|\bwaitfor[\s+]+delay\b)', in: [query, body, cookies] }
      - name: database-metadata
        match: { regex: '(?i)(information_schema|sysobjects|syscolumns|xp_cmdshell|load_file|into\s+(out|dump)file|@@version)', in: [query, body, cookies] }
      - name: comment-obfuscation
        match: { regex: '(?i)(--|#)[^\n]{0,12}\b(select|union|insert|update|delete|drop|from|where)\b', in: [query, body, cookies] }

  # NoSQL injection operators.
  - name: nosql-injection
    action: BLOCK
    rules:
      - name: mongo-operators
        match: { regex: '(?i)\$(where|ne|gt|gte|lt|lte|regex|exists|nin|or|and)\b', in: [query, body] }

  # Cross-site scripting signatures.
  - name: xss
    action: BLOCK
    rules:
      - name: script-tags
        match: { regex: '(?i)<\s*/?\s*(script|iframe|object|embed|applet)\b', in: [query, body, headers] }
      - name: event-handlers
        match: { regex: '(?i)\bon(error|load|click|dblclick|mousedown|mouseup|mouseover|mouseout|mousemove|focus|blur|change|submit|reset|keydown|keyup|keypress|input|start|animationstart|animationend|transitionend|toggle|scroll|wheel|drag|drop|copy|cut|paste|pointerdown|pointerup|touchstart|touchend)\s*=', in: [query, body, headers] }
      - name: javascript-uri
        match: { regex: '(?i)(javascript|vbscript)\s*:', in: [query, body, headers] }
      - name: data-html-uri
        match: { regex: '(?i)data\s*:\s*(text/html|text/javascript|application/javascript|application/xhtml)', in: [query, body, headers] }
      - name: dom-sinks
        match: { regex: '(?i)(document\.(cookie|domain|write)|window\.location|eval\s*\(|expression\s*\()', in: [query, body] }

  # Directory traversal and local file inclusion.
  - name: path-traversal
    action: BLOCK
    rules:
      - name: dot-dot-slash
        match: { regex: '(?i)(\.\.[/\\]|\.\.(%2f|%5c)|%2e%2e|%252e%252e)', in: [path, query, body] }
      - name: sensitive-system-files
        match: { regex: '(?i)(/etc/(passwd|shadow|group|hosts)|/proc/self|win\.ini|boot\.ini|/windows/system32)', in: [path, query, body] }
      - name: php-wrappers
        match: { regex: '(?i)(php://(filter|input|data)|(expect|zip|phar)://)', in: [path, query, body] }
      - name: userdir-dot-segment
        match: { regex: '/~[^/]+/\./', in: [path] }
      - name: windows-short-names
        match: { regex: '(?i)~[0-9](\.|/|\\|$)', in: [path] }
      # CVE-2026-87902 (WordPress) and CVE-2025-49132 (Pterodactyl) reached
      # pearcmd.php; no legitimate application path contains it.
      - name: pearcmd-in-path
        match: { regex: '(?i)(^|/)pearcmd(\.php)?($|[/?])', in: [path, query] }
      # '/..' sequences without a leading dot (CVE-2021-3199, CVE-2026-108902)
      # are not covered by dot-dot-slash.
      - name: slash-dot-dot-traversal
        match: { regex: '[/\\]\.\.(?:[/\\%]|$)', in: [path, query, body] }
      # CVE-2021-3199 (ONLYOFFICE): the upload PoC body starts with
      # ENCRYPTED;/.. to escape the document working directory.
      - name: onlyoffice-encrypted-upload-traversal
        match: { regex: '^ENCRYPTED;/\.\.', in: [body] }

  # Encoded separators and matrix parameters used to desynchronize path-based
  # authorization (CVE-2026-50559, CVE-2026-73551).
  - name: path-normalization
    action: BLOCK
    rules:
      - name: matrix-parameter
        match: { regex: '(?i)(;|%3b)', in: [path] }
      - name: encoded-path-separator
        match: { regex: '(?i)(%2f|%5c)', in: [path] }

  # Server-side request forgery: cloud metadata endpoints and loopback targets.
  - name: ssrf
    action: BLOCK
    rules:
      - name: metadata-endpoints
        match: { regex: '(?i)(169\.254\.169\.254|metadata\.google\.internal|100\.100\.100\.200)', in: [query, body] }
      - name: internal-addresses
        match: { regex: '(?i)(https?|gopher|dict|ftp)://(127\.0\.0\.1|localhost|0\.0\.0\.0|\[::1\])', in: [query, body] }
      - name: file-scheme
        match: { regex: '(?i)file://', in: [query, body] }

  # XML external entity payloads.
  - name: xxe
    action: BLOCK
    rules:
      - name: doctype-and-entity
        match: { regex: '(?i)<!DOCTYPE[^>]{0,200}\[|<!ENTITY\b', in: [body] }

  # Encoding tricks used to smuggle paths and headers.
  - name: protocol-anomalies
    action: BLOCK
    rules:
      - name: null-byte
        match: { regex: '(?i)%00', in: [path, query] }
      - name: crlf-injection
        match: { regex: '(?i)(%0d%0a|%0a%0d|%0d|%0a)', in: [path, query, headers] }
      - name: double-encoded-characters
        match: { regex: '(?i)%25(2e|3c|3e|27|22|2f|5c)', in: [path, query] }
      - name: malformed-host-header
        match: { headers: { Host: '[/?#]' } }
      - name: malformed-forwarded-host-header
        match: { headers: { X-Forwarded-Host: '[/?#]' } }
      # CVE-2026-63292 needs a Host over 8192 bytes; a 1024-byte cap is well
      # above the 255-byte DNS limit and below the regex size limit.
      - name: oversized-host-header
        match: { headers: { Host: '^.{1024,}$' } }
      - name: multi-range-flood
        match: { headers: { Range: '(?i)bytes=(?:[^,]*,){4,}' } }

  # nginx rewrite capture overflows (CVE-2026-42945, CVE-2026-9256) are driven
  # by request targets dense with URI-escapable bytes that expand during
  # rewrite escaping; legitimate paths rarely repeat them.
  - name: nginx-capture-overflow
    action: BLOCK
    rules:
      - name: escapable-plus-run-in-path
        match: { regex: '\+{16,}', in: [path] }

  # WebDAV and HTTP Digest endpoints accumulate memory-safety and authentication
  # flaws (CVE-2026-42528, CVE-2026-48005, CVE-2026-58415, CVE-2026-59685,
  # CVE-2026-73636, CVE-2026-73637, CVE-2026-93546). Remove the Digest rule if
  # the protected application requires Digest authentication.
  - name: webdav-and-digest
    action: BLOCK
    rules:
      - name: webdav-state-directory
        match: { regex: '(?i)(^|/)\.dav(/|$)', in: [path] }
      - name: webdav-lock-abuse
        match: { method: LOCK, headers: { Timeout: '(?i)(infinite|second-\d{10,})' } }
      # CVE-2026-27654 (nginx): COPY or MOVE to the same resource or a
      # parent/child collection overflows a buffer. Narrow this rule if the
      # protected application needs WebDAV copies.
      - name: webdav-copy-move-destination
        match: { method: [COPY, MOVE], headers: { Destination: '.+' } }
      - name: webdav-namespace-flood
        match: { method: PROPPATCH, regex: '(?i)xmlns:[a-z0-9]+=.*xmlns:[a-z0-9]+=.*xmlns:[a-z0-9]+=', in: [body] }
      - name: digest-authentication-abuse
        match: { headers: { Authorization: '(?i)^digest\s' } }

  # Executable files disguised as uploads.
  - name: malicious-upload
    action: BLOCK
    rules:
      - name: executable-filenames
        match: { method: [POST, PUT], regex: '(?i)filename\s*=\s*"[^"]*\.(php[0-9]?|phtml|phar|jspx?|asp|aspx|ashx|asmx|cgi|pl|py|sh|exe|dll|war)\b', in: [body] }
      - name: traversal-in-filename
        match: { regex: '(?i)filename\s*=\s*"[^"]*(\.\.[/\\]|\.\.%2f|\.\.%5c)', in: [body] }

  # Credentials, repository metadata, and backup files are hidden with a 404.
  - name: sensitive-files
    action: BLOCK
    response: { status: 404, body: Not Found }
    rules:
      - name: credentials-and-config
        match: { regex: '(?i)(^|/)(\.env(\.|$)|\.git(/|$)|\.svn(/|$)|\.hg(/|$)|\.DS_Store|\.aws(/|$)|\.ssh(/|$)|\.htpasswd|\.htaccess|id_rsa|credentials(\.|$)|secrets?\.(ya?ml|json|toml)|wp-config\.php)', in: [path] }
      - name: backup-and-dump-files
        match: { regex: '(?i)\.(bak|backup|old|orig|save|swp|swo|sql)(\.|$)', in: [path] }

  # Common admin interfaces are logged by default. Once you have allowlisted your
  # own admin addresses in trusted-sources, raise this category to BLOCK.
  - name: admin-interfaces
    action: LOG
    rules:
      - name: common-admin-paths
        match: { regex: '(?i)(^|/)(wp-admin(/|$)|wp-login\.php|xmlrpc\.php|phpmyadmin|pma(/|$)|adminer\.php|manager/html|solr(/|$))', in: [path] }

  # Request signatures for the 2026-10 KEV intake: pre-auth RCE, deserialization,
  # and command-injection paths with published request shapes.
  - name: cve-2026-10-signatures
    action: BLOCK
    rules:
      # CVE-2025-55182 (React Server Components, "React2Shell"): the Flight
      # protocol deserializes a multipart Server Function payload whose root
      # object sets a "then" of $N:__proto__:then and reaches Function through
      # :constructor:constructor.
      - name: react-rsc-flight-deserialization
        match: { regex: '(?i)(__proto__:then|\$\d+:constructor:constructor|"status"\s*:\s*"resolved_model")', in: [body] }
      # CVE-2025-26399 (SolarWinds Web Help Desk): unauthenticated Java
      # deserialization through the AjaxProxy WebObjects action.
      - name: solarwinds-whd-ajaxproxy
        match: { path: '(?i)^/helpdesk/WebObjects/Helpdesk\.woa/wa/AjaxProxy', regex: '(?i)(javaclass|java\.lang\.|@class)', in: [body, query] }
      # CVE-2026-105134 (Ahsay AhsayCBS): OS command injection in the
      # Replication Receiver random argument.
      - name: ahsay-updatereceivers-command
        match: { path: '(?i)^/rps/api/json/UpdateReceivers\.do$', regex: '(?i)random[^&]{0,40}(;|\||&&|\$\(|`)', in: [body, query] }
      # CVE-2026-10520 (Ivanti Sentry): the MICS configuration handler accepts
      # an unauthenticated execute-system command document.
      - name: ivanti-sentry-commandexec
        match:
          path: '(?i)^/mics/api/v2/sentry/mics-config/handleMessage$'
          regex: '(?i)(commandexec|reqandres|/configuration/system/)'
          in: [body]
      # CVE-2026-8037 (Progress Kemp LoadMaster): four single quotes in the
      # /accessv2 apiuser field overflow the unescaped, unterminated buffer
      # into the adjacent sprayed command payload.
      - name: loadmaster-accessv2-quote-overflow
        match: { path: '(?i)^/accessv2$', regex: '(?i)"apiuser"\s*:\s*"''{4}', in: [body] }
      # CVE-2026-21589 (Atlassian Jira/Confluence/Bitbucket): the resource
      # download handler follows ..:: pseudo-directories into WEB-INF.
      - name: atlassian-wildcard-path-traversal
        match: { regex: '(?i)\.\.::', in: [path] }
      # CVE-2026-55573 (e107): install.php unserializes the previous_steps POST
      # parameter into an attacker-controlled callable.
      - name: e107-install-previous-steps-deserialization
        match: { path: '(?i)^/install\.php$', regex: '(?i)previous_steps=[^&]*O:\d+:', in: [body] }
      # CVE-2026-59774 (Gitea): the Org-mode renderer resolves #+INCLUDE
      # directives to server-side files through the markup API.
      - name: gitea-orgmode-include-file-read
        match: { path: '(?i)^/api/v1/markup$', regex: '(?i)#\+INCLUDE\s*:', in: [body] }
      # CVE-2026-107204 (LMCache): /run_script executes caller-supplied Python.
      - name: lmcache-run-script-exec
        match: { path: '(?i)^/run_script$', regex: '(?i)(__import__|os\.system|subprocess|builtins)', in: [body] }
      # CVE-2026-107640 (Integrics Enswitch): the password update API treats a
      # missing reset key as a valid empty reset.
      - name: enswitch-password-reset-bypass
        match: { path: '(?i)^/api/json/user/password/update/?$', regex: '(?i)(username|user)', in: [body] }

  # Response inspection runs after the upstream response arrives. Response
  # bodies are inspected up to limits.max_response_body_bytes as received
  # (compressed bodies are not decompressed); when the limit is reached the
  # prefix is inspected and the remainder is streamed through. The default
  # `in` target is `response_body`; request conditions such as `path` still
  # apply. BLOCK replaces the upstream response with the configured response.
  - name: response-leaks
    phase: response
    action: LOG
    rules:
      - name: private-key-material     # blocks: private keys never leave the server
        action: BLOCK
        match: { regex: '-----BEGIN [A-Z ]*PRIVATE KEY-----', in: [response_body] }
      - name: stack-trace
        match: { regex: '(?i)(traceback \(most recent call last\)|stack backtrace:|panic: runtime error:)' }
      - name: sql-error-message
        match: { regex: '(?i)(sql syntax.*(mysql|mariadb)|ORA-[0-9]{5}|postgresql.*(error|exception)|sqlite3\.OperationalError)' }
      - name: server-version-leak
        match: { response_headers: { Server: '(?i)(apache|nginx|microsoft-iis|lighttpd)/[0-9]' } }

timeouts:
  header_read: 10s
  body_read: 30s
  upstream_connect: 5s
  upstream_response: 30s
  shutdown_grace: 10s

# The body limit also bounds upload size. Raise max_body_bytes if your
# application receives larger uploads. max_response_body_bytes bounds how much
# of each upstream response response rules inspect before streaming the rest.
limits:
  max_path_bytes: 8192
  max_header_bytes: 32768
  max_headers: 100
  max_body_bytes: 1048576
  max_response_body_bytes: 1048576

protection:
  enabled: true
  allowlist: [127.0.0.1/32]
  max_connections_per_ip: 32
  max_connections: 1024
  requests_per_second: 20
  burst: 60
  global_requests_per_second: 2000
  max_tracked_ips: 100000
  aggregate_ipv6_prefix: 64
  ban:
    violations: 5
    window: 10s
    duration: 60s
    max_duration: 1h

admin:
  enabled: true
  listen: 127.0.0.1:9090

# Response header policy, applied to every response Kunato sends, including
# upstream responses and its own block/error responses. Header names are
# case-insensitive and a name in both lists is replaced. Hop-by-hop headers
# and alt-svc are managed by the proxy and cannot be changed here.
response_headers:
  remove: [server, x-powered-by]
  # set:
  #   server: webserver

# Optional TLS termination; remove the comments and point the paths at a
# PEM-encoded certificate chain and private key to serve HTTPS.
# tls:
#   cert_file: /etc/kunato/cert.pem
#   key_file: /etc/kunato/key.pem
