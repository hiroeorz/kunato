        match: { path: '(?i)^/cli$', regex: '(?i)remoting=false', in: [query] }
      - name: dlink-nas-sharing-system
        match: { path: '(?i)^/cgi-bin/nas_sharing\.cgi$', regex: '(?i)(^|&)system=', in: [query] }
      - name: cleo-vlsync-header
        match: { path: '(?i)^/Synchronization$', headers: { VLSync: '.+' } }
      - name: ofbiz-program-export
        match: { regex: '(?i)^/webtools/control/.*ProgramExport', in: [path] }
      - name: ofbiz-xmldsdump
        match: { regex: '(?i)^/webtools/control/forgotPassword/xmldsdump$', in: [path] }
      - name: ofbiz-stats-decorator
        match: { regex: '(?i)statsdecoratorlocation', in: [body] }
      - name: spring-cloud-dataflow-package-upload
        match: { path: '(?i)^/api/package/upload$', regex: '(?i)packagefileasbytes', in: [body] }
      - name: crushftp-function-endpoint
        match: { regex: '(?i)^/WebInterface/function/?$', in: [path] }
      - name: servicenow-jelly-page-title
        match: { regex: '(?i)jvar_page_title', in: [query] }
      - name: coldfusion-dotdot-cfide
        match: { regex: '(?i)\.\.CFIDE/', in: [path] }
      - name: ivanti-vtm-user-creation
        match: { path: '(?i)^/apps/zxtm/wizard\.fcgi$', regex: '(?i)create_user', in: [body] }
      - name: ivanti-csa-encoded-index
        match: { regex: '(?i)^/client/index\.php(%3f|\?)\.php', in: [path] }
      - name: tomcat-case-confusion-jsp-put
        match: { method: PUT, regex: '(?i)\.jspx?$', in: [path] }
      - name: tomcat-case-confusion-artifacts
        match: { regex: '(?i)^/(aa|bb)\.jsp$', in: [path] }
      - name: encoded-question-mark-in-path
        match: { regex: '(?i)%3f', in: [path] }
      - name: spring-uri-userinfo-fragment-bypass
        match: { regex: '(?i)(%5c|%23)@', in: [query] }
      - name: nextjs-image-optimizer-ssrf
        match: { path: '(?i)^/_next/image$', regex: '(?i)url=https?://', in: [query] }
      - name: gitlab-saml-callback
        match: { path: '(?i)^/users/auth/saml/callback$', regex: '(?i)samlresponse=', in: [body] }
      - name: magento-cosmicsting-xxe
        match: { regex: '(?i)(totalscollector|dataisurl)', in: [body] }
  # Framework routing bypasses: internal route parameters, prefetch variants,
  # RPC deserialization, and request-controlled trust flags (CVE-2026-44574,
  # CVE-2026-44575, CVE-2026-27971, CVE-2026-67282).
  - name: framework-routing-bypass
    action: BLOCK
    rules:
      - name: nextjs-internal-route-parameters
        match: { regex: '(?i)(^|[?&])(nxtp|nxti)[a-z0-9_]*=', in: [query] }
      - name: nextjs-rsc-route-variants
        match: { regex: '(?i)\.rsc($|/)', in: [path] }
      - name: nextjs-rsc-transport-header
        match: { method: GET, headers: { RSC: '^1$' } }
      - name: qwik-rpc-deserialization
        match: { headers: { Content-Type: '(?i)application/qwik-json' } }
      - name: joomla-fabrik-eval-flag
        match: { regex: '(?i)\[eval\]\s*=', in: [query, body] }

  # Exposed CI/CD endpoints are consistent RCE and data-theft targets
  # (CVE-2026-63077, CVE-2026-85706, CVE-2026-70428, CVE-2026-84671).
  - name: ci-cd-servers
    action: BLOCK
    rules:
      - name: teamcity-agent-protocol
        match: { regex: '(?i)^/app/agents/v1/', in: [path] }
      - name: teamcity-xstream-payload
        match: { regex: '(?i)(linked-hash-map|schemapmismatchexception|connectioninitsqls)', in: [body] }
      - name: jspws-webshell
        match: { regex: '(?i)\.jspws($|/)', in: [path] }
      - name: gitlab-workhorse-route-bypass
        match: { regex: '(?i)/api/v4/projects/[^/]+/repository/%[0-9a-f]{2}', in: [path] }
      - name: gitlab-repository-file-read
        match:
          path: '(?i)/api/v4/projects/[^/]+/repository/'
          regex: '(?i)file\.path='
          in: [query, body]
      - name: jenkins-file-parameter-path
        match: { regex: '(?i)(init\.groovy\.d|\.jpi\b|\.groovy\b)', in: [body] }

  # OS command injection signatures.
  - name: command-injection
    action: BLOCK
    rules:
      - name: shell-metacharacters
        match: { regex: '(?i)(;|\||&&|\|\||&\s+)\s*(busybox|cat|ls|id|whoami|uname|hostname|pwd|env|sleep|ping|nslookup|dig|host|telnet|socat|openssl|base64|xxd|touch|echo|printf|mkdir|rm|mv|cp|chmod|chown|kill|ps|netstat|ifconfig|iptables|tar|zip|unzip|awk|sed|cut|head|tail|find|grep|dd|curl|wget|nc|ncat|netcat|bash|sh|zsh|dash|python[0-9.]*|perl[0-9.]*|ruby[0-9.]*|php[0-9.]*|node[0-9.]*|certutil|bitsadmin|wmic|schtasks|findstr|tasklist|reg|sc|net|dir|type|cmd|powershell|pwsh)\b', in: [query, body] }
      # POSIX shells and cmd.exe accept `&` without a following space. The
      # suffix class keeps parameters such as `&id=5` out while matching
      # `&whoami` and `&id;whoami`.
      - name: ampersand-command
        match: { regex: '(?i)&\s*(busybox|cat|ls|id|whoami|uname|hostname|pwd|env|sleep|ping|nslookup|dig|host|telnet|socat|openssl|base64|xxd|touch|echo|printf|mkdir|rm|mv|cp|chmod|chown|kill|ps|netstat|ifconfig|iptables|tar|zip|unzip|awk|sed|cut|head|tail|find|grep|dd|curl|wget|nc|ncat|netcat|bash|sh|zsh|dash|python[0-9.]*|perl[0-9.]*|ruby[0-9.]*|php[0-9.]*|node[0-9.]*|certutil|bitsadmin|wmic|schtasks|findstr|tasklist|reg|sc|net|dir|type|cmd|powershell|pwsh)\b(?:[\s;&|<>#$"\x27\x60]|$)', in: [query, body] }
      - name: command-substitution
        match: { regex: '(?i)(\$\(|`)\s*(busybox|cat|ls|id|whoami|uname|hostname|pwd|env|sleep|ping|nslookup|dig|host|telnet|socat|base64|xxd|touch|echo|printf|mkdir|rm|mv|cp|chmod|chown|kill|awk|sed|cut|head|tail|find|grep|curl|wget|nc|ncat|netcat|bash|sh|zsh|dash|python[0-9.]*|perl[0-9.]*|ruby[0-9.]*|php[0-9.]*|node[0-9.]*|powershell|pwsh|certutil|wmic|schtasks)\b', in: [query, body] }
      # Bash brace expansion runs its first entry as a command: `{cat,/tmp/x}`.
      - name: brace-expansion-command
        match: { regex: '(?i)(;|\||&&|\|\||&\s+|\$\(|`)\s*\{\s*(cat|ls|id|whoami|uname|sleep|ping|echo|touch|base64|bash|sh|nc|ncat|netcat|curl|wget)\s*,', in: [query, body] }
      - name: shell-and-binaries
        match: { regex: '(?i)(/bin/(sh|bash|zsh|dash|busybox|cat|ls|id|whoami|uname|sleep|ping|env|pwd|nc)|/usr/bin/(sh|bash|dash|env|perl|python|php|base64|xxd|socat|openssl|curl|wget|nc|ncat|nslookup|dig|telnet|awk|sed|find)|cmd\.exe|powershell(\.exe)?|pwsh)', in: [query, body, path] }
      # Bash reverse shells use the /dev/tcp pseudo-device (HestiaCP
      # CVE-2026-111627 cron entries and countless others); the shape has no
      # legitimate request-side use.
      - name: bash-dev-tcp
        match: { regex: '(?i)/dev/(tcp|udp)/[a-z0-9.-]+/\d{1,5}', in: [query, body] }

  # SQL injection signatures in query, body, and cookies.
  - name: sql-injection
    action: BLOCK
    response: { status: 403, body: Forbidden }
    rules:
      - name: union-select
        match: { regex: '(?i)\bunion\b[^;]{0,20}\bselect\b', in: [query, body, cookies] }
      - name: boolean-taunts
        match: { regex: '(?i)\b(or|and)\b[\s+]+[\x27"\(\)]?\d+[\x27"\(\)]?[\s+]*=[\s+]*[\x27"\(\)]?\d+[\x27"\(\)]?', in: [query, body, cookies] }
      - name: stacked-queries
        match: { regex: '(?i);\s*(select|insert|update|delete|drop|alter|create|truncate)\b', in: [query, body, cookies] }
      # MySQL accepts comments between a function name and its parenthesis, so
      # the timing rule tolerates whitespace and /*...*/ or --/# comments there.
      - name: time-based
        match: { regex: '(?i)(\b(sleep|benchmark|pg_sleep)\b(?:/\*(?:[^*]|\*[^/])*\*/|[\s#]|--[^\n]*\n)*\(|\bwaitfor\b(?:/\*(?:[^*]|\*[^/])*\*/|[\s#]|--[^\n]*\n)+\bdelay\b)', in: [query, body, cookies] }
      # Blind inference reads one character or bit at a time; the predicate
      # wraps ASCII/SUBSTR/MID/ORD and compares the result.
      - name: blind-inference-functions
        match: { regex: '(?i)\b(ascii|ord|substr(?:ing)?|mid)\s*\([^;]{0,80}\){1,3}\s*(?:[<>=!&|]|\blike\b)', in: [query, body, cookies] }
      # The same inference without a function call: a LIKE prefix test in a
      # boolean context, with a quoted or hex literal.
      - name: blind-inference-like
        match: { regex: '(?i)\b(and|or)\s+[a-z_][a-z0-9_.]*\s+like\s+(0x[0-9a-f]+|[\x27"])', in: [query, body, cookies] }
      # Executable comments /*!...*/ hide the keyword that follows them from
      # word-boundary and adjacency patterns.
      - name: mysql-executable-comments
        match: { regex: '(?i)/\*!\s*\d{0,6}\s*(select|union|insert|update|delete|drop|alter|create|truncate|sleep|benchmark|pg_sleep|waitfor|updatexml|extractvalue)\b', in: [query, body, cookies] }
      - name: database-metadata
        match: { regex: '(?i)(information_schema|sysobjects|syscolumns|xp_cmdshell|load_file|into\s+(out|dump)file|@@version)', in: [query, body, cookies] }
      - name: comment-obfuscation
        match: { regex: '(?i)(--|#)[^\n]{0,12}\b(select|union|insert|update|delete|drop|from|where)\b', in: [query, body, cookies] }

  # NoSQL injection operators.
  - name: nosql-injection
    action: BLOCK
    rules:
      - name: mongo-operators
        match: { regex: '(?i)\$(where|ne|gt|gte|lt|lte|regex|exists|nin|or|and)\b', in: [query, body] }

  # LDAP filter injection: metacharacters that break out of the intended
  # equality filter (`*)(`, `)(|(`, `|(attr=`), wildcard attribute tests, and
  # wildcard credentials on login endpoints. Ordinary values (including the
  # plus and percent encodings of the same shapes) keep passing.
  - name: ldap-injection
    action: BLOCK
    rules:
      - name: filter-breakout
        match: { regex: '(?i)(\*\)\s*\(|\)\s*\(\s*(?:[&|!]|[a-z_][a-z0-9._-]{0,32}(?:=|~=|>=|<=)))', in: [query, body, cookies, headers] }
      - name: filter-operator-chain
        match: { regex: '(?i)[&|!]\s*\(\s*[a-z_][a-z0-9._-]{0,32}(?:=|~=|>=|<=)', in: [query, body, cookies, headers] }
      - name: wildcard-attribute
        match: { regex: '(?i)\(\s*(uid|user(name)?|cn|sn|givenname|displayname|mail|objectclass|userpassword|password|passwd|samaccountname|memberof|distinguishedname)(?:=|~=|>=|<=)\s*(?:%2a|\*)', in: [query, body, cookies] }
      - name: credential-wildcard
        match:
          path: '(?i)(login|logon|signin|sign-in|sign_in|auth|session|sso)'
          regex: '(?i)(^|[?&\s;])(user(name)?|uid|uname|email|log(in)?|logon)\s*=\s*[^&\s]{0,24}(?:%2a|\*)|(^|[?&\s;])(pass(word)?|pwd)\s*=\s*(?:%2a|\*)(?:[&\s;]|$)'
          in: [query, body, cookies]

  # XPath injection: predicate breakouts (`']//`, `'] | //`), path predicates
  # after a boolean operator (`or //user[...]`), blind-inference function
  # probes (`count(/*)`, `substring(//...)`), and quote-based boolean taunts.
  # Numeric taunts (`or 1=1`) are also covered by the SQL injection rules.
  - name: xpath-injection
    action: BLOCK
    rules:
      - name: predicate-breakout
        match: { regex: '(?i)(\]\s*\|\s*//|\]\s*//|\|\s*//|\b(or|and)\s+//)', in: [query, body, cookies] }
      - name: blind-functions
        match: { regex: '(?i)\b(count|string-length|name|local-name|substring|contains|normalize-space|translate)\s*\([^)]{0,64}(/\*|//)', in: [query, body, cookies] }
      - name: quote-function-probe
        match: { regex: '(?i)[\x27"]\s*(or|and)\s+(count|string-length|name|local-name|substring|contains|normalize-space|translate)\s*\(', in: [query, body, cookies] }
      - name: string-taunt
        match: { regex: '(?i)\b(or|and)\b\s+[\x27"][^\x27"]{0,32}[\x27"]\s*=\s*[\x27"]', in: [query, body, cookies] }

  # JDBC connection-string abuse: attacker-supplied jdbcUrl values that turn a
  # datasource-test or import endpoint into file read or code execution
  # (AllData CVE-2026-111613, Apache Kylin CVE-2026-68571, CVE-2026-30067).
  # Benign datasource URLs (no dangerous parameters) keep passing.
  - name: jdbc-injection
    action: BLOCK
    rules:
      - name: jdbc-dangerous-parameters
        match: { regex: '(?i)(allowloadlocalinfile|allowurlinlocalinfile|autodeserialize)\s*=\s*(true|1)\b', in: [query, body, cookies] }
      - name: jdbc-h2-init-rce
        match: { regex: '(?i)jdbc:(h2|hsqldb)[^"''\s]*\b(init|createalias)\s*=\s*(runscript|.{0,96}\.class)', in: [query, body, cookies] }

  # Configuration-file injection: values that end up in php.ini (or the
  # equivalent) and run attacker PHP on the next request. The pfSense CE
  # timezone setting (CVE-2026-111222) is the prototypical shape.
  - name: config-injection
    action: BLOCK
    rules:
      - name: php-ini-directives
        match: { regex: '(?i)(^|[\s"''=;])auto_(prepend|append)_file\s*=', in: [query, body] }
      - name: php-url-include
        match: { regex: '(?i)allow_url_(include|fopen)\s*=\s*(on|true|1)\b', in: [query, body] }

  # Server-side template injection: arithmetic probes and engine gadgets in the
  # delimiters of the common engines (Jinja/Twig, Freemarker, Velocity,
  # ERB/JSP, Thymeleaf, Smarty). `${...}` and `%{...}` shapes are covered by
  # cve-2019-signatures.struts-expression-injection.
  - name: ssti
    action: BLOCK
    rules:
      - name: template-arithmetic
        match: { regex: '(?i)(\{\{\s*[\d\x27"\[(][^}]{0,24}[\*\+\/%][^}]{0,24}\s*\}\}|\*\{\s*[\d\x27"\[(][^}]{0,24}[\*\+\/%][^}]{0,24}\s*\}|#\{\s*[\d\x27"\[(][^}]{0,24}[\*\+\/%][^}]{0,24}\s*\}|@\(\s*[\d\x27"\[(][^)]{0,24}[\*\+\/%][^)]{0,24}\s*\)|<%=\s*[\d\x27"\[(][^%]{0,48}[\*\+\/%][^%]{0,48}%>|\{\s*\d+\s*\*\s*\d+\s*\})', in: [query, body, cookies] }
      - name: template-gadgets
        match: { regex: '(?i)(\{\{\s*(config|self|request|lipsum|cycler|joiner|namespace)\b|\{\{[^}]{0,80}__[a-z]+__|getTemplateFilter|<\s*#(assign|include|import|function)\b|\?new\(\)|\$\s*class\.inspect|#set\s*\(\s*\$)', in: [query, body, cookies] }

  # Prototype pollution: payloads that reach recursive merge, query parsers,
  # or template helpers through `__proto__` and constructor-prototype paths.
  - name: prototype-pollution
    action: BLOCK
    rules:
      - name: pollution-paths
        match: { regex: '(?i)(__proto__|constructor\s*[\[.]\s*prototype)', in: [query, body, cookies] }

  # Cross-site scripting signatures.
  - name: xss
    action: BLOCK
    rules:
      - name: script-tags
        match: { regex: '(?i)<\s*/?\s*(script|iframe|object|embed|applet)\b', in: [query, body, headers] }
      - name: event-handlers
        match: { regex: '(?i)\bon(error|load|click|dblclick|mousedown|mouseup|mouseover|mouseout|mousemove|focus|blur|change|submit|reset|keydown|keyup|keypress|input|start|animationstart|animationend|transitionend|toggle|scroll|wheel|drag|drop|copy|cut|paste|pointerdown|pointerup|touchstart|touchend)\s*=', in: [query, body, headers] }
      - name: javascript-uri
        match: { regex: '(?i)(javascript|vbscript)\s*:', in: [query, body, headers] }
      - name: data-html-uri
        match: { regex: '(?i)data\s*:\s*(text/html|text/javascript|application/javascript|application/xhtml)', in: [query, body, headers] }
      - name: dom-sinks
        match: { regex: '(?i)(document\.(cookie|domain|write)|window\.location|eval\s*\(|expression\s*\()', in: [query, body] }

  # CSS injection: style-context breakout, scriptable CSS properties, and the
  # remote-load and attribute-selector shapes used for blind data exfiltration.
  # Deployments that let users author CSS (theme editors) need to override this
  # category. `behavior:`/`binding:` are not matched: they collide with plain
  # text, and their HTC/XBL execution targets are long dead.
  - name: css-injection
    action: BLOCK
    rules:
      - name: style-tags
        match: { regex: '(?i)<\s*/?\s*style\b', in: [query, body, headers] }
      - name: scriptable-css
        match: { regex: '(?i)(expression\s*\(|-moz-binding\s*:|url\s*\(\s*[\x27"]?\s*(javascript|vbscript)\s*:)', in: [query, body, headers] }
      - name: remote-style-load
        match: { regex: '(?i)(@import\s+[^;]{0,200}(https?:)?//|url\s*\(\s*[\x27"]?\s*(https?:)?//)', in: [query, body] }
      - name: attribute-selector-exfil
        match: { regex: '(?i)\[[^\]]{0,120}[*^$]=[^\]]{0,120}\]\s*\{[^}]{0,300}url\s*\(', in: [query, body] }

  # Open redirect: redirect-style parameters carrying absolute or
  # protocol-relative URLs. OAuth redirect_uri and payment return URLs are
  # intentionally not matched; those are registered out of band.
  - name: open-redirect
    action: BLOCK
    rules:
      - name: redirect-parameter-url
        match: { regex: '(?i)(^|[?&"\x27\s])(redirect(_to|_url|_path)?|redir|return_to|next|continue|goto|dest(ination)?|target_url|out_url)["\x27]?\s*[:=]\s*"?((https?|ftps?)://|//)', in: [query, body, cookies] }

  # Directory traversal and local file inclusion.
  - name: path-traversal
    action: BLOCK
    rules:
      - name: dot-dot-slash
        match: { regex: '(?i)(\.\.[/\\]|\.\.(%2f|%5c)|%2e%2e|%252e%252e)', in: [path, query, body] }
      - name: sensitive-system-files
        match: { regex: '(?i)(/etc/(passwd|shadow|group|hosts)|/proc/self|win\.ini|boot\.ini|/windows/system32)', in: [path, query, body] }
      - name: php-wrappers
        match: { regex: '(?i)(php://(filter|input|data)|(expect|zip|phar)://)', in: [path, query, body] }
      - name: userdir-dot-segment
        match: { regex: '/~[^/]+/\./', in: [path] }
      - name: windows-short-names
        match: { regex: '(?i)~[0-9](\.|/|\\|$)', in: [path] }
      # CVE-2026-87902 (WordPress) and CVE-2025-49132 (Pterodactyl) reached
      # pearcmd.php; no legitimate application path contains it.
      - name: pearcmd-in-path
        match: { regex: '(?i)(^|/)pearcmd(\.php)?($|[/?])', in: [path, query] }
      # '/..' sequences without a leading dot (CVE-2021-3199, CVE-2026-108902)
      # are not covered by dot-dot-slash.
      - name: slash-dot-dot-traversal
        match: { regex: '[/\\]\.\.(?:[/\\%]|$)', in: [path, query, body] }
      # CVE-2021-3199 (ONLYOFFICE): the upload PoC body starts with
      # ENCRYPTED;/.. to escape the document working directory.
      - name: onlyoffice-encrypted-upload-traversal
        match: { regex: '^ENCRYPTED;/\.\.', in: [body] }

  # Encoded separators and matrix parameters used to desynchronize path-based
  # authorization (CVE-2026-50559, CVE-2026-73551).
  - name: path-normalization
    action: BLOCK
    rules:
      - name: matrix-parameter
        match: { regex: '(?i)(;|%3b)', in: [path] }
      - name: encoded-path-separator
        match: { regex: '(?i)(%2f|%5c)', in: [path] }

  # Remote file inclusion: include-style parameters that point at a remote
  # URL, a protocol-relative URL, or a UNC host. Per-host allowlisting cannot
  # be expressed as a request pattern, so every remote include is treated as
  # hostile; sites that legitimately include from a fixed host need an
  # override.
  - name: remote-file-inclusion
    action: BLOCK
    rules:
      - name: remote-url-include-parameter
        match: { regex: '(?i)(^|[?&"\x27\s])(include|include_once|require|require_once|page|template|tpl|module|mod|load|import|file|path|dir|view|lang|content)["\x27]?\s*[:=]\s*"?(https?|ftps?|sftp|tftp|smb|nfs|gopher|dict)://', in: [query, body] }
      - name: protocol-relative-include-parameter
        match: { regex: '(?i)(^|[?&"\x27\s])(include|include_once|require|require_once|page|template|tpl|module|mod|load|import|file|path|dir|view|lang|content)["\x27]?\s*[:=]\s*"?[\\/]{2}', in: [query, body] }

  # Server-side request forgery: cloud metadata endpoints, private,
  # link-local, and CGNAT targets, encoded and shorthand loopback addresses,
  # IPv6 equivalents, and protocol-relative values.
  - name: ssrf
    action: BLOCK
    rules:
      - name: metadata-endpoints
        match: { regex: '(?i)(169\.254\.169\.254|metadata\.google\.internal|100\.100\.100\.200)', in: [query, body] }
      - name: internal-addresses
        match: { regex: '(?i)(https?|gopher|dict|ftp|sftp|tftp|ldap|ldaps)://(127\.[0-9]|localhost([/:?#&"\x27\s]|$)|0\.0\.0\.0|10\.[0-9]|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]|192\.168\.[0-9]|169\.254\.[0-9]|100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]|\[::1\]|\[::\]|\[(f[cd][0-9a-f]{0,2}|fe[89ab][0-9a-f]?):|\[::ffff:(127\.|10\.|192\.168\.|169\.254\.|172\.(1[6-9]|2[0-9]|3[01])\.|7f00:1\]))', in: [query, body] }
      - name: encoded-addresses
        match: { regex: '(?i)(https?|gopher|dict|ftp|sftp|tftp|ldap|ldaps)://(2130706433|017700000001|0x7f0{5}1|0x7f\.0\.0\.1|0x7f\.1|0177\.0\.0\.1)([/:?#&"\x27\s]|$)', in: [query, body] }
      - name: protocol-relative-internal
        match: { regex: '(?i)//(127\.[0-9]|10\.[0-9]|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]|192\.168\.[0-9]|169\.254\.[0-9]|100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]|localhost([/:?#&"\x27\s]|$)|\[::1\])', in: [query, body] }
      - name: file-scheme
        match: { regex: '(?i)file://', in: [query, body] }

  # XML external entity payloads.
  - name: xxe
    action: BLOCK
    rules:
      - name: doctype-and-entity
        match: { regex: '(?i)<!DOCTYPE[^>]{0,200}\[|<!ENTITY\b', in: [body] }

  # Ruby deserialization payloads: base64 Marshal blobs (BAh7 is the base64 of
  # the "\x04\x08" Marshal header), percent-encoded raw Marshal bytes, and the
  # YAML !ruby tags used for object injection through YAML.load. Active Storage
  # signed IDs wrap a JSON document instead and do not carry the literal
  # prefix.
  - name: ruby-deserialization
    action: BLOCK
    rules:
      - name: marshal-payloads
        match: { regex: '(^|[^A-Za-z0-9+/])(BAh7[A-Za-z0-9+/_-]{20,}=*|%04%08)', in: [query, body, cookies] }
      - name: yaml-ruby-tags
        match: { regex: '(?i)!ruby/[a-z]+', in: [query, body] }

  # Python deserialization payloads: base64 pickle blobs (the `gAJ`/`gAS`/`gAR`
  # prefixes are the base64 of the protocol 2 and 4 pickle headers),
  # percent-encoded raw pickle bytes, and the PyYAML `!!python/` tags that
  # reach unsafe loaders.
  - name: python-deserialization
    action: BLOCK
    rules:
      - name: pickle-payloads
        match: { regex: '(^|[^A-Za-z0-9+/])(gA[JRS][A-Za-z0-9+/]{20,}=*|%80%0[24])', in: [cookies, query, body] }
      - name: yaml-python-tags
        match: { regex: '(?i)!!python/[a-z/]+', in: [query, body] }

  # PHP object injection: serialized object (`O:`) and custom (`C:`) values in
  # cookies, query, or parameters that reach `unserialize`.
  - name: php-deserialization
    action: BLOCK
    rules:
      - name: serialized-objects
        match: { regex: '(?i)(^|[^a-z0-9])(O|C):\d+:"', in: [cookies, query, body] }

  # Java deserialization payloads: the base64 `rO0AB` magic and the
  # percent-encoded stream header. Raw \xac\xed bytes are not matched because
  # they occur naturally in binary bodies.
  - name: java-deserialization
    action: BLOCK
    rules:
      - name: serialized-streams
        match: { regex: '(?i)(rO0AB|%AC%ED%00%05)', in: [cookies, query, body] }

  # Encoding tricks used to smuggle paths and headers.
  - name: protocol-anomalies
    action: BLOCK
    rules:
      - name: null-byte
        match: { regex: '(?i)%00', in: [path, query] }
      - name: crlf-injection
        match: { regex: '(?i)(%0d%0a|%0a%0d|%0d|%0a)', in: [path, query, headers] }
      - name: double-encoded-characters
        match: { regex: '(?i)%25(2e|3c|3e|27|22|2f|5c)', in: [path, query] }
      - name: malformed-host-header
        match: { headers: { Host: '[/?#]' } }
      - name: malformed-forwarded-host-header
        match: { headers: { X-Forwarded-Host: '[/?#]' } }
      # CVE-2026-63292 needs a Host over 8192 bytes; a 1024-byte cap is well
      # above the 255-byte DNS limit and below the regex size limit.
      - name: oversized-host-header
        match: { headers: { Host: '^.{1024,}$' } }
      - name: multi-range-flood
        match: { headers: { Range: '(?i)bytes=(?:[^,]*,){4,}' } }

  # nginx rewrite capture overflows (CVE-2026-42945, CVE-2026-9256) are driven
  # by request targets dense with URI-escapable bytes that expand during
  # rewrite escaping; legitimate paths rarely repeat them.
  - name: nginx-capture-overflow
    action: BLOCK
    rules:
      - name: escapable-plus-run-in-path
        match: { regex: '\+{16,}', in: [path] }

  # WebDAV and HTTP Digest endpoints accumulate memory-safety and authentication
  # flaws (CVE-2026-42528, CVE-2026-48005, CVE-2026-58415, CVE-2026-59685,
  # CVE-2026-73636, CVE-2026-73637, CVE-2026-93546). Remove the Digest rule if
  # the protected application requires Digest authentication.
  - name: webdav-and-digest
    action: BLOCK
    rules:
      - name: webdav-state-directory
        match: { regex: '(?i)(^|/)\.dav(/|$)', in: [path] }
      - name: webdav-lock-abuse
        match: { method: LOCK, headers: { Timeout: '(?i)(infinite|second-\d{10,})' } }
      # CVE-2026-27654 (nginx): COPY or MOVE to the same resource or a
      # parent/child collection overflows a buffer. Narrow this rule if the
      # protected application needs WebDAV copies.
      - name: webdav-copy-move-destination
        match: { method: [COPY, MOVE], headers: { Destination: '.+' } }
      - name: webdav-namespace-flood
        match: { method: PROPPATCH, regex: '(?i)xmlns:[a-z0-9]+=.*xmlns:[a-z0-9]+=.*xmlns:[a-z0-9]+=', in: [body] }
      - name: digest-authentication-abuse
        match: { headers: { Authorization: '(?i)^digest\s' } }

  # Executable files disguised as uploads.
  - name: malicious-upload
    action: BLOCK
    rules:
      - name: executable-filenames
        match: { method: [POST, PUT], regex: '(?i)filename\s*=\s*"[^"]*\.(php[0-9]?|phtml|phar|jspx?|asp|aspx|ashx|asmx|cgi|pl|py|sh|exe|dll|war)\b', in: [body] }
      - name: traversal-in-filename
        match: { regex: '(?i)filename\s*=\s*"[^"]*(\.\.[/\\]|\.\.%2f|\.\.%5c)', in: [body] }

  # Development-only Rails endpoints; they must not exist in production.
  - name: rails-debug-endpoints
    action: BLOCK
    rules:
      - name: rails-internals
        match: { regex: '(?i)^/rails/(info(/|$)|mailers(/|$)|conductor(/|$))', in: [path] }
      - name: letter-opener
        match: { regex: '(?i)^/letter_opener(/|$)', in: [path] }

  # Development-only Django endpoints; they must not exist in production.
  - name: django-debug-endpoints
    action: BLOCK
    rules:
      - name: django-debug-toolbar
        match: { regex: '(?i)^/__debug__/', in: [path] }

  # Development-only Next.js endpoints; they must not exist in production.
  - name: nextjs-dev-endpoints
    action: BLOCK
    rules:
      - name: nextjs-dev-routes
        match: { regex: '(?i)^(/__nextjs|/_next/webpack-hmr)', in: [path] }

  # Development-only Laravel endpoints; they must not exist in production.
  # The Horizon dashboard is production software and stays in admin-interfaces
  # (LOG) instead.
  - name: laravel-debug-endpoints
    action: BLOCK
    rules:
      - name: laravel-debug-routes
        match: { regex: '(?i)^(/telescope|/_debugbar)(/|$)', in: [path] }

  # Vite and Nuxt development servers; the /@fs/ handler reads arbitrary files.
  - name: vite-dev-endpoints
    action: BLOCK
    rules:
      - name: vite-dev-routes
        match: { regex: '(?i)^(/@fs/|/@vite/|/@id/|/__vite_ping|/__nuxt_devtools__)', in: [path] }

  # Spring Boot Actuator endpoints that dump configuration, secrets, heaps, or
  # thread state; health and info stay open for monitoring probes.
  - name: spring-actuator
    action: BLOCK
    rules:
      - name: actuator-sensitive-endpoints
        match: { regex: '(?i)^/actuator/(env|heapdump|threaddump|mappings|beans|configprops|jolokia|loggers|httptrace|httpexchanges|auditevents|scheduledtasks|shutdown|caches|sessions|flyway|liquibase|quartz|integrationgraph)(/|$)', in: [path] }

  # Model management and notebook kernel endpoints of AI services (Ollama,
  # Jupyter). Deployments that drive these through Kunato intentionally need an
  # override.
  - name: ai-service-management
    action: BLOCK
    rules:
      - name: management-endpoints
        match: { regex: '(?i)^/api/(pull|delete|create|push|copy|kernels|terminals)(/|$)', in: [path] }

  # Credentials, repository metadata, and backup files are hidden with a 404.
  - name: sensitive-files
    action: BLOCK
    response: { status: 404, body: Not Found }
    rules:
      - name: credentials-and-config
        match: { regex: '(?i)(^|/)(\.env(\.|$)|\.git(/|$)|\.svn(/|$)|\.hg(/|$)|\.DS_Store|\.aws(/|$)|\.ssh(/|$)|\.htpasswd|\.htaccess|id_rsa|credentials([./]|$)|secrets?\.(ya?ml|json|toml)|master\.key|database\.yml|storage\.yml|settings\.py|local_settings\.py|composer\.(json|lock)|wp-config\.php)', in: [path] }
      - name: backup-and-dump-files
        match: { regex: '(?i)\.(bak|backup|old|orig|save|swp|swo|sql)(\.|$)', in: [path] }
      # phpinfo() pages left in the web root leak configuration and paths;
      # generic `info.php`/`test.php` names are left alone as application files.
      - name: phpinfo-endpoints
        match: { regex: '(?i)^/\.?(php_?info|phpversion)(\.php)?/?$', in: [path] }
      # Rails writes its default logs here; the directory must not be served.
      - name: log-files
        match: { regex: '(?i)^/log/[^/]*\.log$', in: [path] }
      # Active Storage's DiskService root; files here are served through
      # signed /rails/active_storage URLs, never directly.
      - name: active-storage-root
        match: { regex: '(?i)^/storage(/|$)', in: [path] }

  # API discovery surfaces are logged by default. Public API documentation is
  # common, so raise this category to BLOCK only when the docs are not meant to
  # be reachable. GraphQL introspection follows the same policy.
  - name: api-discovery
    action: LOG
    rules:
      - name: swagger-endpoints
        match: { regex: '(?i)^/(swagger(-ui)?(\.html|\.json|\.ya?ml)?|swagger-resources|v[23]/api-docs|api-docs(\.(json|ya?ml))?|openapi\.(json|ya?ml))(/|$)', in: [path] }
      - name: graphql-introspection
        match: { regex: '(?i)(__schema\b|__type\s*\()', in: [query, body] }

  # Common admin interfaces are logged by default. Once you have allowlisted your
  # own admin addresses in trusted-sources, raise this category to BLOCK.
  - name: admin-interfaces
    action: LOG
    rules:
      - name: common-admin-paths
        match: { regex: '(?i)(^|/)(wp-admin(/|$)|wp-login\.php|xmlrpc\.php|phpmyadmin|pma(/|$)|adminer\.php|manager/html|solr(/|$)|sidekiq(/|$)|pghero(/|$)|flipper(/|$)|blazer(/|$)|delayed_job(/|$)|good_job(/|$)|horizon(/|$))', in: [path] }

  # JSON Web Token attacks: unsecured (alg=none) headers, tokens whose signature
  # segment is missing, and key-lookup headers (kid/jku/jwk/x5u/x5c) that point
  # verification at attacker-controlled key material. Tokens are base64url, so
  # the patterns match the encoded shapes of the common serializations; the JWT
  # section of blackbox/requests/blocked.txt lists the covered shapes and the
  # limits (algorithm confusion and claim tampering have no static signature).
  - name: jwt
    action: BLOCK
    rules:
      - name: none-algorithm
        match: { regex: '(?i)(eyJhbGciOiJub25lI|eyJ0eXAiOiJKV1QiLCJhbGciOiJub25lI|eyJhbGciOiAibm9uZS|eyJ0eXAiOiJKV1QiLCJhbGciOiAibm9uZS|eyJhbGciOiJOb25lI|eyJhbGciOiJOT05FI|eyJhbGciOiJuT25FI|"alg"\s*:\s*"none"[^}]{0,80}"typ"\s*:\s*"JWT"|"typ"\s*:\s*"JWT"[^}]{0,80}"alg"\s*:\s*"none")', in: [query, body, cookies, headers] }
      - name: missing-signature
        match: { regex: '(?:^|[\s=,;:"(\[{])eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{4,}\.(?:\s|$|["&;,)\]}])|(?:^|[\s=,;:"(\[{])eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{4,}(?:\s|$|["&;,)\]}])', in: [query, body, cookies, headers] }
      - name: key-header-injection
        match: { regex: '(ImtpZCI6Ii4u|ImtpZCI6Ii9kZXY|ImtpZCI6ImZpb|ImtpZCI6Imh0dHA|ImtpZCI6Inxp|ImtleXxpZCJ9|Ii4uLy4u|Li4vLi4v|8uLi8uLi9|VU5JT04gU0VMRUNU|Vx1MDAw|ImprdSI6|Imp3ayI6|Ing1dSI6|Ing1YyI6)', in: [query, body, cookies, headers] }

  # Request signatures for the 2026-04 Rack release: multipart parser denial of
  # service shapes with published request-level detail.
  - name: cve-2026-04-signatures
    action: BLOCK
    rules:
      # CVE-2026-34827 (Rack): escape-heavy quoted part parameters drive
      # super-linear work in the multipart header parser. Legitimate name and
      # filename values never carry this many backslashes.
      - name: rack-multipart-escape-flood
        match: { headers: { Content-Type: '(?i)^multipart/form-data' }, regex: '(?i)(name|filename)="(?:[^"\\]*\\){16,}', in: [body] }
      # CVE-2026-34829 (Rack): multipart uploads without Content-Length parse
      # until EOF with no size bound. Browsers never chunk form uploads, so a
      # chunked multipart request is rejected outright.
      - name: rack-chunked-multipart-upload
        match: { headers: { Transfer-Encoding: '(?i)chunked', Content-Type: '(?i)^multipart/form-data' } }

  # Request signatures for the 2026-10 KEV intake: pre-auth RCE, deserialization,
  # and command-injection paths with published request shapes.
  - name: cve-2026-10-signatures
    action: BLOCK
    rules:
      # CVE-2025-55182 (React Server Components, "React2Shell"): the Flight
      # protocol deserializes a multipart Server Function payload whose root
      # object sets a "then" of $N:__proto__:then and reaches Function through
      # :constructor:constructor.
      - name: react-rsc-flight-deserialization
        match: { regex: '(?i)(__proto__:then|\$\d+:constructor:constructor|"status"\s*:\s*"resolved_model")', in: [body] }
      # CVE-2025-26399 (SolarWinds Web Help Desk): unauthenticated Java
      # deserialization through the AjaxProxy WebObjects action.
      - name: solarwinds-whd-ajaxproxy
        match: { path: '(?i)^/helpdesk/WebObjects/Helpdesk\.woa/wa/AjaxProxy', regex: '(?i)(javaclass|java\.lang\.|@class)', in: [body, query] }
      # CVE-2026-105134 (Ahsay AhsayCBS): OS command injection in the
      # Replication Receiver random argument.
      - name: ahsay-updatereceivers-command
        match: { path: '(?i)^/rps/api/json/UpdateReceivers\.do$', regex: '(?i)random[^&]{0,40}(;|\||&&|\$\(|`)', in: [body, query] }
      # CVE-2026-10520 (Ivanti Sentry): the MICS configuration handler accepts
      # an unauthenticated execute-system command document.
      - name: ivanti-sentry-commandexec
        match:
          path: '(?i)^/mics/api/v2/sentry/mics-config/handleMessage$'
          regex: '(?i)(commandexec|reqandres|/configuration/system/)'
          in: [body]
      # CVE-2026-8037 (Progress Kemp LoadMaster): four single quotes in the
      # /accessv2 apiuser field overflow the unescaped, unterminated buffer
      # into the adjacent sprayed command payload.
      - name: loadmaster-accessv2-quote-overflow
        match: { path: '(?i)^/accessv2$', regex: '(?i)"apiuser"\s*:\s*"''{4}', in: [body] }
      # CVE-2026-21589 (Atlassian Jira/Confluence/Bitbucket): the resource
      # download handler follows ..:: pseudo-directories into WEB-INF.
      - name: atlassian-wildcard-path-traversal
        match: { regex: '(?i)\.\.::', in: [path] }
      # CVE-2026-55573 (e107): install.php unserializes the previous_steps POST
      # parameter into an attacker-controlled callable.
      - name: e107-install-previous-steps-deserialization
        match: { path: '(?i)^/install\.php$', regex: '(?i)previous_steps=[^&]*O:\d+:', in: [body] }
      # CVE-2026-59774 (Gitea): the Org-mode renderer resolves #+INCLUDE
      # directives to server-side files through the markup API.
      - name: gitea-orgmode-include-file-read
        match: { path: '(?i)^/api/v1/markup$', regex: '(?i)#\+INCLUDE\s*:', in: [body] }
      # CVE-2026-107204 (LMCache): /run_script executes caller-supplied Python.
      - name: lmcache-run-script-exec
        match: { path: '(?i)^/run_script$', regex: '(?i)(__import__|os\.system|subprocess|builtins)', in: [body] }
      # CVE-2026-107640 (Integrics Enswitch): the password update API treats a
      # missing reset key as a valid empty reset.
      - name: enswitch-password-reset-bypass
        match: { path: '(?i)^/api/json/user/password/update/?$', regex: '(?i)(username|user)', in: [body] }
      # CVE-2026-111687 (WeRSS / we-mp-rss): the public /rss/{feed_id} endpoint
      # compiles the template parameter and reaches object-subclass traversal.
      - name: werss-rss-template-ssti
        match:
          path: '(?i)^/rss/[^/]+$'
          regex: '\{\{=[^}]{0,200}(constructor|__class__|subclasses|process|global)'
          in: [query]
      # CVE-2026-111641 (FastapiAdmin): the auto-login endpoints are
      # unauthenticated and mint a session for any user.
      - name: fastapiadmin-auto-login-bypass
        match: { path: '(?i)^/api/v1/auth/auto-login(/|$)' }
      # CVE-2026-111391 (SGLang debug dumper): /dumper/configure evals a
      # caller-supplied filter while the endpoint is unauthenticated; a
      # re.search gadget walks __globals__ back to the real builtins. The
      # dunder access is what legitimate filter expressions never need.
      - name: sglang-dumper-filter-eval
        match: { path: '(?i)^/dumper/configure$', regex: '(?i)(__globals__|__builtins__|__subclasses__|__class__)', in: [body, query] }

  # Response inspection runs after the upstream response arrives. Response
  # bodies are inspected up to limits.max_response_body_bytes; gzip, deflate,
  # br, and zstd bodies are decompressed for matching first. When the limit is
  # reached the prefix is inspected and the remainder is streamed through. The
  # default `in` target is `response_body`; request conditions such as `path`
  # still apply. BLOCK replaces the upstream response with the configured
  # response.
  - name: response-leaks
    phase: response
    action: LOG
    rules:
      - name: private-key-material     # blocks: private keys never leave the server
        action: BLOCK
        match: { regex: '-----BEGIN [A-Z ]*PRIVATE KEY-----', in: [response_body] }
      - name: stack-trace
        match: { regex: '(?i)(traceback \(most recent call last\)|stack backtrace:|panic: runtime error:)' }
      - name: sql-error-message     # blocks: SQL errors leak schema and query text
        action: BLOCK
        match: { regex: '(?i)(sql syntax.*(mysql|mariadb)|ORA-[0-9]{5}|postgresql.*(error|exception)|sqlite3\.OperationalError)' }
      # Django's technical 404/500 page dumps settings, the SECRET_KEY, SQL,
      # and source while DEBUG = True; never forward it.
      - name: django-debug-page
        action: BLOCK
        match: { regex: '(?i)(debug\s*=\s*true\s*</code>\s*in your django settings|you\x27re seeing this error because you have)' }
      - name: server-version-leak
        match: { response_headers: { Server: '(?i)(apache|nginx|microsoft-iis|lighttpd)/[0-9]' } }

