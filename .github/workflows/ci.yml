name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'push' || github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@v2
      - run: cargo fmt --manifest-path blackbox/Cargo.toml --check
      - run: cargo clippy --manifest-path blackbox/Cargo.toml --all-targets -- -D warnings
      - run: shellcheck scripts/install.sh scripts/update-dist-rules.sh scripts/fetch-cve-delta.sh
      - run: cargo build --release
      - run: cargo test
