# Daily CVE rule update.
#
# Fetches the NVD eight-day delta, runs an OpenCode agent over the daily watch
# skills, then verifies every gate deterministically and commits to main only
# when everything is green.
#
# Required repository secrets:
#   OPENCODE_API_KEY  OpenCode Go API key used by `opencode run`.
# Optional:
#   NVD_API_KEY       Raises the NVD API rate limit for backfill runs.
#
# Test with a manual workflow_dispatch run first; enable "dry run" to stop
# before the commit and push. The agent never receives the push token.
#
# The signing job runs no cargo or third-party build code. Build and test steps
# run in the read-only `verify` job, so a build script cannot write a file that
# inherits the rule artifact's push authority.

name: Daily CVE update

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      model:
        description: OpenCode model as provider/model
        required: false
        default: ""
      since:
        description: Backfill start date for the NVD API (YYYY-MM-DD)
        required: false
        default: ""
      dry_run:
        description: Run every step but skip the commit and push
        type: boolean
        default: false

concurrency:
  group: daily-cve
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      MODEL: ${{ inputs.model || 'opencode-go/deepseek-v4.1-flash' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the NVD delta
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          SINCE: ${{ inputs.since }}
        run: |
          set -euo pipefail
          if [ -n "${SINCE:-}" ]; then
            ./scripts/fetch-cve-delta.sh --out target/cve-delta \
              --since "$SINCE" --min-cvss 7.0 --attack-vector N
          else
            ./scripts/fetch-cve-delta.sh --out target/cve-delta \
              --min-cvss 7.0 --attack-vector N
          fi

      - name: Upload the candidate list
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cve-candidates
          path: |
            target/cve-delta/candidates.md
            target/cve-delta/candidates.jsonl
          if-no-files-found: warn

      - name: Install opencode
        env:
          OPENCODE_VERSION: 1.0.180
        run: |
          set -euo pipefail
          curl -fsSL https://opencode.ai/install | bash -s -- --version "$OPENCODE_VERSION"
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Run the daily CVE agent
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set -euo pipefail
          opencode run --auto --model "$MODEL" "$(cat .github/prompts/daily-cve.md)" 2>&1 \
            | tee "$RUNNER_TEMP/opencode.log"

      - name: Check the change allowlist
        run: |
          set -euo pipefail
          {
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sort -u > "$RUNNER_TEMP/changed.txt"
          cat "$RUNNER_TEMP/changed.txt"
          status=0
          while IFS= read -r path; do
            case "$path" in
              blackbox/requests/blocked.txt | blackbox/requests/allowed.txt | \
                rules.example.yaml | dist/rules.yaml | dist/rules.yaml.sha256 | \
                dist/rules.yaml.minisig | docs/cve-coverage.md | \
                docs/engine-gaps.md) ;;
              *)
                echo "::error::unexpected change: $path"
                status=1
                ;;
            esac
          done < "$RUNNER_TEMP/changed.txt"
          exit "$status"

      - name: Upload allowlisted changes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: daily-cve-changes
          path: |
            blackbox/requests/blocked.txt
            blackbox/requests/allowed.txt
            rules.example.yaml
            docs/cve-coverage.md
            docs/engine-gaps.md
          if-no-files-found: error

      - name: Save the patch artifact
        if: always()
        run: |
          git add -N .
          git diff --binary > "$RUNNER_TEMP/daily-cve.patch" || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: daily-cve-diagnostics
          path: |
            ${{ runner.temp }}/daily-cve.patch
            ${{ runner.temp }}/opencode.log
            ${{ runner.temp }}/changed.txt
          if-no-files-found: warn

  verify:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download allowlisted changes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: daily-cve-changes
          path: ${{ runner.temp }}/staged-changes

      - name: Apply allowlisted data files
        run: |
          set -euo pipefail
          for path in \
            blackbox/requests/blocked.txt \
            blackbox/requests/allowed.txt \
            rules.example.yaml \
            docs/cve-coverage.md \
            docs/engine-gaps.md; do
            staged="$RUNNER_TEMP/staged-changes/$path"
            if [ -f "$staged" ] && [ ! -L "$staged" ]; then
              cp -- "$staged" "$path"
            fi
          done

      - name: Regenerate the managed rule set
        run: scripts/update-dist-rules.sh

      - name: Check the rules policy
        run: python3 scripts/check-rules-policy.py rules.example.yaml dist/rules.yaml

      - name: Test the rules policy gate
        run: python3 scripts/test_check_rules_policy.py

      - name: Test the black-box gate
        run: python3 scripts/test_blackbox_gate.py

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2

      - name: Check the published rules against the newest release
        run: scripts/check-rules-compat.sh

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2

      - name: Test
        # The verify job regenerates `dist/rules.yaml` from the agent-edited
        # `rules.example.yaml`, so it necessarily holds an unsigned candidate.
        # `the_committed_rules_signature_is_valid` embeds the committed pair and
        # would fail for every changed rule set before the policy and black-box
        # gates run. The sign-and-push job verifies the new signature with the
        # embedded rules key, and this test still runs in normal CI on the
        # committed pair.
        run: cargo test --locked -- --skip the_committed_rules_signature_is_valid

      - name: Check blackbox formatting
        run: cargo fmt --manifest-path blackbox/Cargo.toml --check

      - name: Lint blackbox
        run: cargo clippy --manifest-path blackbox/Cargo.toml --all-targets --locked -- -D warnings

      - name: Test blackbox
        run: cargo test --manifest-path blackbox/Cargo.toml --locked

      - name: Validate the example rules
        run: |
          set -euo pipefail
          cargo build --release --locked
          ./target/release/kunato --config rules.example.yaml --validate

      - name: Run the black-box test
        run: scripts/blackbox-test.sh --color never --workdir "$RUNNER_TEMP/kunato-blackbox"

      - name: Upload blackbox logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: daily-cve-blackbox-logs
          path: ${{ runner.temp }}/kunato-blackbox/*.log
          if-no-files-found: warn

  sign-and-push:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    # Signing and push run on a fresh runner VM isolated from the untrusted
    # agent and from all build code: only the allowlisted data files cross the
    # job boundary, and this job runs no cargo command.
    environment: rules-signing
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download allowlisted changes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: daily-cve-changes
          path: ${{ runner.temp }}/staged-changes

      - name: Apply allowlisted data files
        run: |
          set -euo pipefail
          for path in \
            blackbox/requests/blocked.txt \
            blackbox/requests/allowed.txt \
            rules.example.yaml \
            docs/cve-coverage.md \
            docs/engine-gaps.md; do
            staged="$RUNNER_TEMP/staged-changes/$path"
            if [ -f "$staged" ] && [ ! -L "$staged" ]; then
              cp -- "$staged" "$path"
            fi
          done

      - name: Install minisign
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign

      - name: Regenerate the managed rule set
        run: scripts/update-dist-rules.sh

      - name: Check the rules policy
        run: python3 scripts/check-rules-policy.py rules.example.yaml dist/rules.yaml

      - name: Test the rules policy gate
        run: python3 scripts/test_check_rules_policy.py

      - name: Verify the corpus is append-only
        run: |
          set -euo pipefail
          # Compare bytes against the committed blob rather than counting
          # text-diff deletions: one NUL byte makes git report a binary diff,
          # which a deletion count treats as zero and would accept any rewrite.
          python3 - <<'PY'
          import subprocess
          import sys

          failed = False
          for path in ("blackbox/requests/blocked.txt", "blackbox/requests/allowed.txt"):
              old = subprocess.check_output(["git", "show", f"HEAD:{path}"])
              with open(path, "rb") as handle:
                  new = handle.read()
              if not new.startswith(old):
                  print(f"::error::{path} may only be appended to", file=sys.stderr)
                  failed = True
          sys.exit(1 if failed else 0)
          PY

      - name: Sign the managed rule set
        env:
          RULES_SIGNING_KEY: ${{ secrets.RULES_SIGNING_KEY }}
          RULES_SIGNING_PASSPHRASE: ${{ secrets.RULES_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          if git diff --quiet -- dist/rules.yaml; then
            echo "rule set unchanged; keeping the existing signature"
            exit 0
          fi
          umask 077
          key="$RUNNER_TEMP/rules.key"
          trap 'shred -u "$key" 2>/dev/null || rm -f "$key"' EXIT INT TERM
          printf '%s' "$RULES_SIGNING_KEY" >"$key"
          printf '%s\n' "$RULES_SIGNING_PASSPHRASE" | /usr/bin/minisign -S -s "$key" \
            -m dist/rules.yaml -x dist/rules.yaml.minisig \
            -t "rules.yaml $(date -u +%FT%TZ)"

      - name: Verify the managed rule set signature
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/rules.pub" <<'PY'
          import re
          import sys

          text = open("src/trust.rs", encoding="utf-8").read()
          rules = text.split("pub const RULES_KEYS", 1)[1]
          match = re.search(r'"(untrusted comment: minisign public key [^"]+?\\n[^"]+?)"', rules)
          if not match:
              raise SystemExit("could not read the rules public key from src/trust.rs")
          open(sys.argv[1], "w", encoding="utf-8").write(
              match.group(1).replace("\\n", "\n") + "\n"
          )
          PY
          minisign -V -m dist/rules.yaml -x dist/rules.yaml.minisig -p "$RUNNER_TEMP/rules.pub"

      - name: Commit and push
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          allowed='^(blackbox/requests/(blocked|allowed)\.txt|rules\.example\.yaml|docs/(cve-coverage|engine-gaps)\.md|dist/rules\.yaml(\.sha256|\.minisig)?)$'
          unexpected=$(
            {
              git diff --name-only
              git ls-files --others --exclude-standard
            } | sort -u | grep -vE "$allowed" || true
          )
          if [ -n "$unexpected" ]; then
            echo "::error::workspace change outside the rule artifact: $unexpected"
            exit 1
          fi
          git add -- blackbox/requests/blocked.txt blackbox/requests/allowed.txt \
            rules.example.yaml docs/cve-coverage.md docs/engine-gaps.md \
            dist/rules.yaml dist/rules.yaml.sha256 dist/rules.yaml.minisig
          unexpected=$(git diff --cached --name-only | sort -u | grep -vE "$allowed" || true)
          if [ -n "$unexpected" ]; then
            echo "::error::staged change outside the rule artifact: $unexpected"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "no rule artifact changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gaps=$(git diff --cached -- docs/engine-gaps.md \
            | grep '^+| CVE-' \
            | grep -oE 'CVE-[0-9]{4}-[0-9]{4,}' \
            | sort -u | paste -sd ',' - | sed 's/,/, /g' || true)
          commit_args=(-m "Update CVE rules and corpus" -m "Automated daily CVE intake.")
          if [ -n "$gaps" ]; then
            commit_args+=(-m "Engine gaps needing a source change: $gaps")
            {
              echo "## Engine gaps needing a source change"
              echo
              echo "$gaps"
              echo
              echo "See docs/engine-gaps.md."
            } >>"$GITHUB_STEP_SUMMARY"
          fi
          git commit "${commit_args[@]}"
          git remote set-url origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${GITHUB_REF_NAME}"
