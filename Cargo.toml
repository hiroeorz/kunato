[package]
name = "kunato"
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hiroeorz/kunato"
publish = false

[dependencies]
arc-swap = "1"
async-trait = "0.1"
brotli-decompressor = { version = "6", default-features = false, features = ["std"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "native-tokio", "ring", "rustls-native-certs", "tls12"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
ipnet = "2"
notify = "8"
quinn = { version = "0.11", default-features = false, features = ["log", "runtime-tokio", "rustls-ring"] }
regex = "1"
# Directly used for HIR-based validation of ALLOW rule anchors.
regex-syntax = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-native-certs = "0.8"
ruzstd = { version = "0.9", default-features = false, features = ["std", "hash"] }
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
tokio-rustls-acme = { version = "0.9.1", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
brotli = "9"
rcgen = "0.14"
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
