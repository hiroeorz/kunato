name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'push' || github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2
      - run: cargo fmt --manifest-path blackbox/Cargo.toml --check
      - run: cargo clippy --manifest-path blackbox/Cargo.toml --all-targets --locked -- -D warnings
      - run: shellcheck scripts/install.sh scripts/check-deny.sh scripts/release.sh scripts/update-dist-rules.sh scripts/fetch-cve-delta.sh scripts/check-rules-compat.sh
      - run: python3 scripts/test_check_rules_policy.py
      - run: cargo build --release --locked
      - run: cargo test --locked
      - run: scripts/check-rules-compat.sh
